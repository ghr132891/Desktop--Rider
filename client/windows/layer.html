<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Desktop Rider 桌面层</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas,img{position:fixed;inset:0;display:block;width:100vw;height:100vh;user-select:none;-webkit-user-drag:none}canvas{z-index:1}img{z-index:2;object-fit:fill}
/* 桌面歌词 — the same rules as styles.css in the web app, in px for this monitor */
.lyrics-box{position:fixed;z-index:3;transform:translate(-50%,-50%);line-height:1.25;user-select:none;pointer-events:none;--lyr-dur:.5s;--lyr-next:.55;--lyr-stroke:transparent}
.lyrics-box.shadow{text-shadow:0 .08em .3em #0b182c80}
.lyrics-box.stroke .lyrics-line,.lyrics-box.stroke .lyrics-next,.lyrics-box.stroke .lyrics-trans{-webkit-text-stroke:.06em var(--lyr-stroke);paint-order:stroke fill}
.lyrics-stage{position:relative;min-height:1.25em}
.lyrics-line{position:absolute;left:0;right:0;top:0;opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyrics-line.in{opacity:1}
.lyrics-box[data-transition=fade] .lyrics-line{transition:opacity var(--lyr-dur) ease}
.lyrics-box[data-transition=slide] .lyrics-line{transition:opacity var(--lyr-dur) ease,transform var(--lyr-dur) ease;transform:translateY(.6em)}.lyrics-box[data-transition=slide] .lyrics-line.in{transform:none}.lyrics-box[data-transition=slide] .lyrics-line.out{transform:translateY(-.6em)}
.lyrics-box[data-transition=blur] .lyrics-line{transition:opacity var(--lyr-dur) ease,filter var(--lyr-dur) ease;filter:blur(.25em)}.lyrics-box[data-transition=blur] .lyrics-line.in{filter:none}
.lyrics-box[data-transition=none] .lyrics-line{transition:none}
.lyrics-trans{font-size:.6em;opacity:.85;margin-top:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lyrics-trans:empty,.lyrics-next:empty{display:none}
.lyrics-next{font-size:.7em;opacity:var(--lyr-next);margin-top:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head>
<body><canvas id="live" hidden></canvas><img id="overlay" alt="" hidden><div id="lyrics" class="lyrics-box" hidden><div class="lyrics-stage"><div class="lyrics-line"></div><div class="lyrics-line"></div></div><div class="lyrics-trans"></div><div class="lyrics-next"></div></div>
<script>
// Transparent, click-through window parented under the wallpaper host (see native/bridge.ps1).
//   ?img=<file url>   transparent overlay PNG: floating person copies and modules drawn above the person
//   ?live=<json>      {video:<file url>, still:<file url>, plan:{width,height,gapColor,pieces:[{polygon,x,y,w,h}]}} — the
//                     shared wallpaper video plays clipped to each wallpaper piece, exactly like the still pieces were cut
//   ?clips=<json>     {width,height,still,items:[{video,x,y,w,h,rotate,flipX,opacity,blur,hue,saturate,brightness,radius,blend,fit,above}]}
//                     video layers (modules/layers.js), each painted per frame with its own transform, look and blend mode
//   ?lyrics=<json>    {style:{x,y,width,size,font,weight,color,stroke,strokeColor,shadow,align,transition,duration,next,nextOpacity,trans,offset},lines:[{t,text,trans}]}
//                     桌面歌词 (modules/lyrics.js); main.js then calls __setLyrics(...) when the words arrive and __setMedia(...)
//                     with the player's position (system media session). Without a player the lines loop on an own clock.
//   &v=<stamp>        defeats the image cache
// Overlay only: the PNG shows by itself. With any video the page composes everything on one opaque canvas —
// still wallpaper, live pieces, clips below the person, the overlay, clips above it — so blend modes have a backdrop.
// Redraws happen only when a video presents a new frame (requestVideoFrameCallback) or an image finishes loading; a
// 30 fps video therefore costs 30 draws a second, whatever the monitor's refresh rate.
// main.js calls window.__setPaused(paused, reason) from lib/power.js: desktop hidden by a window, lock screen,
// battery, suspend. Paused videos present no frames and the lyrics clock stops, so nothing is drawn until resumed.
const q=new URLSearchParams(location.search),img=document.getElementById('overlay'),canvas=document.getElementById('live');
window.__frames=0;window.__paused=false;window.__pauseReason='';window.__clips=[];window.__video=null;
const live=q.get('live')?JSON.parse(q.get('live')):null,clips=q.get('clips')?JSON.parse(q.get('clips')):null,overlaySrc=q.get('img')?q.get('img')+'#'+(q.get('v')||''):null;
const items=(clips&&Array.isArray(clips.items)?clips.items:[]);
const pauseHooks=[];window.__setPaused=(paused,reason)=>{window.__paused=!!paused;window.__pauseReason=paused?String(reason||''):'';for(const fn of pauseHooks)fn(!!paused);};
if(!live&&!items.length){if(overlaySrc){img.hidden=false;img.src=overlaySrc;}}
else{
 const W=live?live.plan.width:clips.width,H=live?live.plan.height:clips.height;
 canvas.hidden=false;canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
 if(live)document.body.style.background=live.plan.gapColor;
 let scheduled=false;const schedule=()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;render();});};
 const picture=src=>{if(!src)return null;const im=new Image();im.onload=schedule;im.src=src;return im;};
 const still=picture(live?.still||clips?.still||null),overlay=picture(overlaySrc);
 const videos=[];
 const mkVideo=src=>{const v=Object.assign(document.createElement('video'),{muted:true,loop:true,playsInline:true,preload:'auto',src});
  v.addEventListener('loadeddata',schedule);
  if(typeof v.requestVideoFrameCallback==='function'){const onFrame=()=>{schedule();v.requestVideoFrameCallback(onFrame);};v.requestVideoFrameCallback(onFrame);}
  else{let last=-1;const poll=()=>{if(v.currentTime!==last){last=v.currentTime;schedule();}requestAnimationFrame(poll);};requestAnimationFrame(poll);} // older Chromium: fall back to polling
  videos.push(v);if(!window.__paused)v.play().catch(()=>{});return v;};
 const liveVideo=live?mkVideo(live.video):null;if(liveVideo)liveVideo.addEventListener('error',()=>{document.title='Desktop Rider 桌面层 · 视频无法播放';});
 for(const c of items)c.video=mkVideo(c.video);
 window.__video=liveVideo||items[0]?.video||null;window.__clips=items.map(c=>c.video);
 pauseHooks.push(paused=>{for(const v of videos){if(paused)v.pause();else v.play().catch(()=>{});}if(!paused)schedule();});
 const blends={normal:'source-over',multiply:'multiply',screen:'screen',overlay:'overlay','soft-light':'soft-light',lighten:'lighten',darken:'darken',difference:'difference'};
 const ready=im=>im&&im.complete&&im.naturalWidth>0;
 const drawClip=c=>{const v=c.video;if(v.readyState<2||!v.videoWidth)return;ctx.save();
  ctx.globalAlpha=c.opacity/100;ctx.globalCompositeOperation=blends[c.blend]||'source-over';
  const f=[];if(c.blur)f.push(`blur(${c.blur}px)`);if(c.hue)f.push(`hue-rotate(${c.hue}deg)`);if(c.saturate!==100)f.push(`saturate(${c.saturate/100})`);if(c.brightness!==100)f.push(`brightness(${c.brightness/100})`);if(f.length)ctx.filter=f.join(' ');
  ctx.translate(c.x,c.y);ctx.rotate(c.rotate*Math.PI/180);if(c.flipX)ctx.scale(-1,1);
  ctx.beginPath();ctx.roundRect(-c.w/2,-c.h/2,c.w,c.h,c.radius);ctx.clip();
  let dw=c.w,dh=c.h,sx=0,sy=0,sw=v.videoWidth,sh=v.videoHeight;
  if(c.fit==='cover'){const k=Math.max(c.w/sw,c.h/sh);sw=c.w/k;sh=c.h/k;sx=(v.videoWidth-sw)/2;sy=(v.videoHeight-sh)/2;}else if(c.fit==='contain'){const k=Math.min(c.w/sw,c.h/sh);dw=sw*k;dh=sh*k;}
  ctx.drawImage(v,sx,sy,sw,sh,-dw/2,-dh/2,dw,dh);ctx.restore();};
 const render=()=>{
  ctx.clearRect(0,0,W,H);
  if(live){ctx.fillStyle=live.plan.gapColor;ctx.fillRect(0,0,W,H);}
  if(ready(still))ctx.drawImage(still,0,0,W,H);
  if(liveVideo&&liveVideo.readyState>=2)for(const p of live.plan.pieces){ctx.save();ctx.beginPath();p.polygon.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.clip();ctx.drawImage(liveVideo,p.x,p.y,p.w,p.h);ctx.restore();}
  for(const c of items)if(!c.above)drawClip(c);
  if(ready(overlay))ctx.drawImage(overlay,0,0,W,H);
  for(const c of items)if(c.above)drawClip(c);
  window.__frames++;};
 schedule();
}
// ---- 桌面歌词 ----
const lyricsCfg=q.get('lyrics')?JSON.parse(q.get('lyrics')):null,box=document.getElementById('lyrics');
window.__lyrics={lines:0,line:'',index:-1,media:null,provider:'',error:'',ticks:0};window.__setLyrics=()=>{};window.__setMedia=()=>{};
if(lyricsCfg&&lyricsCfg.style){
 const st=lyricsCfg.style;let lines=Array.isArray(lyricsCfg.lines)?lyricsCfg.lines:[],media=null,slot=0,shownKey='',started=Date.now();
 Object.assign(box.style,{left:st.x+'px',top:st.y+'px',width:st.width+'px',fontSize:st.size+'px',fontFamily:st.font,fontWeight:st.weight,color:st.color,textAlign:st.align});
 box.style.setProperty('--lyr-dur',st.duration+'s');box.style.setProperty('--lyr-next',String(st.nextOpacity/100));box.style.setProperty('--lyr-stroke',st.stroke?st.strokeColor:'transparent');
 box.classList.toggle('shadow',!!st.shadow);box.classList.toggle('stroke',!!st.stroke);box.dataset.transition=st.transition;box.querySelector('.lyrics-next').hidden=!st.next;box.querySelector('.lyrics-trans').hidden=!st.trans;
 const slots=box.querySelectorAll('.lyrics-line');
 const show=i=>{const line=lines[i],key=(line?lines.indexOf(line)+'|'+line.text:'')+'|'+lines.length;if(key===shownKey)return;shownKey=key;
  const next=slots[slot^=1],prev=slots[slot^1];next.textContent=line?.text||'';next.classList.remove('out','in');void next.offsetWidth;next.classList.add('in');prev.classList.remove('in');prev.classList.add('out');
  box.querySelector('.lyrics-trans').textContent=line?.trans||'';box.querySelector('.lyrics-next').textContent=lines[i+1]?.text||'';window.__lyrics.line=line?.text||'';window.__lyrics.index=i;};
 const index=t=>{let i=-1;for(let k=0;k<lines.length;k++){if(lines[k].t<=t)i=k;else break;}return i;};
 // Player position when a media session reports one (interpolated while playing); otherwise an own clock that loops.
 const now=()=>{const off=Number(st.offset)||0;if(media){return media.position+(media.playing?(Date.now()-media.at)/1000:0)+off;}if(!lines.length)return 0;const span=lines[lines.length-1].t+3;return ((Date.now()-started)/1000)%span+off;};
 const tick=()=>{if(window.__paused)return;box.hidden=!lines.length;if(!lines.length)return;show(Math.max(0,index(now())));window.__lyrics.ticks++;};
 window.__setLyrics=({lines:l,provider,error}={})=>{lines=Array.isArray(l)?l:[];shownKey='';started=Date.now();window.__lyrics.lines=lines.length;window.__lyrics.provider=provider||'';window.__lyrics.error=error||'';tick();};
 window.__setMedia=m=>{media=m&&typeof m.position==='number'?{position:m.position,playing:!!m.playing,at:Date.now()}:null;window.__lyrics.media=media?{position:media.position,playing:media.playing}:null;tick();};
 setInterval(tick,100);tick();
}
</script></body></html>
