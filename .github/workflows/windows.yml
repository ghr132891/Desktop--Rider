# Windows client verification on real Windows (GitHub-hosted runners have an interactive desktop
# with Explorer running, so bridge.ps1 can set wallpapers and parent layer windows for real).
#   windows-2025 → Windows Server 2025, the Windows 11 24H2 codebase (Progman branch)
#   windows-2022 → Windows Server 2022, the Windows 10 21H2 codebase (WorkerW branch)
# Each run uploads desktop screenshots + report.json; the dist job uploads the x64 installer.
name: Windows client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '!client/windows/README.md'
      - 'core.js'
      - 'app.js'
      - 'cutout.js'
      - 'portrait.js'
      - 'wallpaper-engine.js'
      - '*-worker.js'
      - 'modules/**'
      - 'index.html'
      - 'styles.css'
      - 'vendor/**'
      - 'assets/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'core.js'
      - 'app.js'
      - 'modules/**'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client/windows

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/windows/package-lock.json
      - name: System info
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' | Select-Object ProductName, DisplayVersion, CurrentBuild | Format-List
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId | Format-Table
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Select-Object DeviceName, Primary, Bounds | Format-List
          # Integrity level of the job (and so of Electron + bridge): tells whether the layer test ran elevated. Shown as an annotation on the public run page.
          $label = (whoami /groups | Select-String 'Mandatory Label').Line -replace '\s+', ' '
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $explorer = (Get-Process explorer -ErrorAction SilentlyContinue | Select-Object -First 1).SessionId
          "::notice title=process integrity::elevated=$admin; $label; explorer session=$explorer; job session=$([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"
      - run: npm ci
      # Each step repeats the tail of a failing command as an error annotation (test/ci-run.cjs): logs need a login.
      - name: Bridge self-check (Windows PowerShell 5.1 compiles and answers)
        shell: pwsh
        run: |
          $mon = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native/bridge.ps1 -Command monitors 2>&1 | Out-String; $c1 = $LASTEXITCODE
          $cov = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native/bridge.ps1 -Command covering -Hwnd 0 -Left 0 -Top 0 -Width 1024 -Height 768 2>&1 | Out-String; $c2 = $LASTEXITCODE
          $med = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native/bridge.ps1 -Command media 2>&1 | Out-String; $c3 = $LASTEXITCODE
          $text = ("monitors (exit $c1): " + $mon.Trim() + "%0Acovering (exit $c2): " + $cov.Trim() + "%0Amedia (exit $c3): " + $med.Trim()) -replace "`r?`n", '%0A'
          if ($c1 -ne 0 -or $c2 -ne 0 -or $c3 -ne 0) { "::error title=bridge.ps1 self-check::$text"; exit 1 } else { "::notice title=bridge.ps1 self-check::$text" }
      - name: Unit tests
        run: node test/ci-run.cjs "npm test" npm test
      - name: Electron smoke test
        run: node test/ci-run.cjs "npm run smoke" npm run smoke
      - name: Desktop integration (bridge.ps1 against the real desktop)
        run: node test/ci-run.cjs "test/windows.cjs" node test/windows.cjs
        env:
          DESKTOP_RIDER_OUT: ${{ github.workspace }}/client/windows/test/out
      - name: Upload desktop screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}
          path: client/windows/test/out
          if-no-files-found: ignore

  dist:
    name: Installer (x64)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/windows/package-lock.json
      - run: npm ci
      - name: Build NSIS installer and portable exe
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        with:
          name: DesktopRider-windows-x64
          path: |
            client/windows/dist/*.exe
            client/windows/dist/*.yml
          if-no-files-found: error
